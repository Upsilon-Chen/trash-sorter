; ============================================================================
;  YOLO 垃圾自动识别分类系统 —— ESP32 舵机分类固件
;  PlatformIO + Arduino framework + ESP32Servo + ArduinoJson
;
;  常用命令（在 esp32/ 目录下执行）：
;    pio run                 编译
;    pio run -t upload       编译并烧录
;    pio device monitor      打开串口监视器（115200）
;    pio run -t clean        清理构建产物
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src

[env]
framework = arduino
platform = espressif32
monitor_speed = 115200
monitor_filters = direct
upload_speed = 921600
lib_ldf_mode = deep+

; 依赖：舵机驱动 + JSON 解析（ArduinoJson v7 的 JsonDocument 为自动扩容）
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.0.4

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; 关闭 ESP32 内核日志，保持串口协议通道干净（需要调试时改成 1）
    -DCORE_DEBUG_LEVEL=0
    ; 打开后会在串口打印调试日志（与 JSON 协议共用串口）
    ; -DTRASH_SORTER_DEBUG=1

; ---------------------------------------------------------------------------
; 默认板卡：最常见的 ESP32 DevKit（ESP32-WROOM-32）
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
; 若插了多个串口设备，可在这里固定端口（Windows 形如 COM5，Linux 形如 /dev/ttyUSB0）
; upload_port = COM5
; monitor_port = COM5

; ---------------------------------------------------------------------------
; 备选板卡（按需启用，或直接改 default_envs）
; ---------------------------------------------------------------------------
; [env:esp32doit-devkit-v1]
; board = esp32doit-devkit-v1
;
; [env:nodemcu-32s]
; board = nodemcu-32s
;
; [env:esp32-s3-devkitc-1]
; board = esp32-s3-devkitc-1
; build_flags =
;     -std=gnu++17
;     -DCORE_DEBUG_LEVEL=0
